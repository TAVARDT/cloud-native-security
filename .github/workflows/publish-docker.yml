name: Publish Docker Image to GHCR 🇺🇸 / Publicar Imagem Docker no GHCR 🇧🇷

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push-hardened-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository 🇺🇸 / Baixar repositório 🇧🇷
        uses: actions/checkout@v4

      - name: Log in to GHCR 🇺🇸 / Login no GHCR 🇧🇷
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata 🇺🇸 / Extrair metadados 🇧🇷
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=node20-hardened
            type=sha,prefix=sha-

      - name: Build and push hardened Node.js image 🇺🇸 / Construir e enviar imagem blindada 🇧🇷
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.hardened
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
