# ----------------------------------------------------------------------
# TAVARDT Elite Kubernetes Pod Security Template
# ----------------------------------------------------------------------
# Description: Demonstrates how to enforce maximum security at the Pod 
# level in Kubernetes. This stops container breakout attacks and ensures 
# compliance with B2B security audits (e.g., SOC2, ISO 27001).
# ----------------------------------------------------------------------

apiVersion: apps/v1
kind: Deployment
metadata:
  name: elite-secure-app
  namespace: production
  labels:
    app: elite-secure-app
spec:
  replicas: 3
  selector:
    matchLabels:
      app: elite-secure-app
  template:
    metadata:
      labels:
        app: elite-secure-app
    spec:
      # 1. Pod-level Security Context
      securityContext:
        # Enforce that all containers in this pod run as user 10001
        runAsUser: 10001
        runAsGroup: 10001
        # Absolutely forbid running as the root user
        runAsNonRoot: true
        # Prevent the container root user from becoming the host root user
        fsGroup: 10001
        # Enable secure computing mode to restrict syscalls
        seccompProfile:
          type: RuntimeDefault

      containers:
      - name: web-container
        image: my-registry.tavardt.com/elite-api:v1.2.0
        ports:
        - containerPort: 3000
        
        # 2. Container-level Security Context (Defense in Depth)
        securityContext:
          # Prevent privilege escalation (suid/sgid binaries won't work)
          allowPrivilegeEscalation: false
          
          # Drop all Linux capabilities
          capabilities:
            drop:
            - ALL
          
          # Mount the root filesystem as read-only (Immutable Infrastructure)
          readOnlyRootFilesystem: true

        # 3. Strict Resource Quotas
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"

        # Since root filesystem is read-only, we provide a temporary volume for /tmp
        volumeMounts:
        - mountPath: /tmp
          name: tmp-volume

      # 4. Ephemeral Volumes
      volumes:
      - name: tmp-volume
        emptyDir: {}
